name: release

# Desktop builds for macOS, Windows and Linux.
#
# Each target builds on its own native runner. Cross-compiling Tauri is not
# practical: Windows needs the MSVC linker plus llvm-rc for the .rc resource,
# and Linux needs webkit2gtk/gtk3, none of which exist on the other hosts.
#
# Draft-only. The workflow never publishes a release on its own — a human
# reviews the artifacts and presses publish.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # create the draft release and upload artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Tauri's Linux build needs the system WebView and tray libraries.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: bun install --frozen-lockfile

      # Stage the llmfit sidecar for THIS target. Without a pinned hash the
      # script writes a stub and the app falls back to native probes, which is
      # a supported configuration — it must never silently ship an unverified
      # binary. See scripts/copy-llmfit-sidecar.mjs.
      - name: Stage sidecar
        run: node scripts/copy-llmfit-sidecar.mjs
        env:
          TARGET_TRIPLE: ${{ matrix.target }}

      - name: Build desktop app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: 'Grove Fit __VERSION__'
          releaseBody: |
            Desktop companion builds.

            These are **unsigned**. macOS will need right-click → Open on first
            launch, and Windows SmartScreen will warn. Signing certificates are
            tracked separately.

            Model catalog derived from llmfit (MIT) — see THIRD_PARTY_NOTICES.md.
          releaseDraft: true
          prerelease: false
          projectPath: apps/desktop
          args: ${{ matrix.args }}
